spring:
  jackson:
    serialization:
      write-dates-as-timestamps: false
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/article_platform}
    username: ${DATABASE_USERNAME:article}
    password: ${DATABASE_PASSWORD:article}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  # Override JWT_SECRET in production — never commit a real secret here
  secret: ${JWT_SECRET:local-dev-secret-change-me-in-production-min32chars}
  expiry-hours: ${JWT_EXPIRY_HOURS:24}

server:
  port: 9090
  error:
    include-message: never
    include-binding-errors: never

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.articleplatform: INFO
    org.springframework.security: WARN
